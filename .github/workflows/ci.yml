name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLASK_APP: run.py
      SECRET_KEY: sample-ci-only-secret-key
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall app tests migrations

      - name: Run Ruff
        run: ruff check .

      - name: Prepare empty CI database
        run: |
          CI_DATABASE_PATH="$RUNNER_TEMP/audio_test_platform_ci.sqlite"
          rm -f "$CI_DATABASE_PATH"
          echo "DATABASE_URI=sqlite:///$CI_DATABASE_PATH" >> "$GITHUB_ENV"

      - name: Upgrade database to migration head
        run: python -m flask --app run.py db upgrade

      - name: Show current migration
        run: python -m flask --app run.py db current

      - name: Check for model migration drift
        run: python -m flask --app run.py db check

      - name: Run tests with coverage
        run: >-
          python -m pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90
