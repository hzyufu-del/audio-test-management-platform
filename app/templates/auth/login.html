{% extends "base.html" %}

{% block title %}登录 - 消费电子音频产品测试管理与自动化辅助平台{% endblock %}

{% block content %}
  <section class="auth-layout">
    <div class="auth-panel">
      <p class="eyebrow">demo access</p>
      <h1>登录</h1>
      <p class="text-muted">用于展示基础账号入口，后续可扩展角色和权限。</p>
      <form method="post" class="vstack gap-3">
        <div>
          <label class="form-label" for="email">邮箱</label>
          <input class="form-control" id="email" name="email" type="email" placeholder="demo@example.com" autocomplete="email">
        </div>
        <div>
          <label class="form-label" for="password">密码</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" type="submit">登录</button>
      </form>
      <p class="mt-3 mb-0 small">没有 demo 账号？<a href="{{ url_for('auth.register') }}">注册一个</a></p>
    </div>
  </section>
{% endblock %}
