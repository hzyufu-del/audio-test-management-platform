services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      SECRET_KEY: "${SECRET_KEY:-replace-with-local-secret}"
      DATABASE_URI: "sqlite:////app/instance/audio_test_platform.sqlite"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-true}"
      AI_ENABLED: "false"
      AI_PROVIDER: "mock"
    volumes:
      - "app_instance:/app/instance"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = urllib.request.urlopen(
              "http://127.0.0.1:5000/api/v1/health", timeout=3
          );
          payload = json.load(response);
          assert response.status == 200 and payload["status"] == "ok"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  app_instance:
