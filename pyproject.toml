[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "htmlcov",
    "instance",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "SIM"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"
